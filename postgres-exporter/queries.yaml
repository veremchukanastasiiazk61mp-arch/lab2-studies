# М2: кількість зʼєднань з базою за станом (active, idle, idle in transaction).
# Показуються лише клієнтські зʼєднання до бази застосунку, без власного зʼєднання експортера.
# Метрика: pg_conn_count{state="..."}; стани без зʼєднань дають 0, а не зникають.
pg_conn:
  query: |
    SELECT s.state AS state, count(a.pid) AS count
    FROM (VALUES ('active'), ('idle'), ('idle in transaction')) AS s(state)
    LEFT JOIN pg_stat_activity a
           ON a.state = s.state
          AND a.datname = current_database()
          AND a.backend_type = 'client backend'
          AND a.pid <> pg_backend_pid()
    GROUP BY s.state
  metrics:
    - state:
        usage: "LABEL"
        description: "Стан зʼєднання"
    - count:
        usage: "GAUGE"
        description: "Кількість зʼєднань у цьому стані"
