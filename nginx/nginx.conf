worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 8192;
}

http {
    # Для підтвердження розподілу між інстансами: upstream= показує адресу вебінстансу
    log_format lb '$time_iso8601 "$request_method $uri" $status rt=$request_time upstream=$upstream_addr';
    access_log /dev/stdout lb;

    # Ім'я web резолвиться в IP усіх реплік під час старту nginx (він стартує
    # після того, як усі репліки web стали healthy). Балансування round-robin.
    upstream web {
        server web:8000;
        keepalive 256;
        keepalive_requests 100000;
    }

    server {
        listen 80;

        # Ендпоінт, який нічого не робить: для самоперевірки генератора навантаження
        location = /noop {
            access_log off;
            return 204;
        }

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
}
